<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Employee Management System</h1>

    <p class="success" th:if="${successMessage}" th:text="${successMessage}"></p>
    <p class="error-box" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <h2>Add Employee</h2>
    <form th:action="@{/employees}" th:object="${employee}" method="post">
        <label>Full Name</label>
        <input type="text" th:field="*{fullName}">
        <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>

        <label>Email</label>
        <input type="text" th:field="*{email}">
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label>Phone</label>
        <input type="text" th:field="*{phone}">
        <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>

        <label>Department</label>
        <input type="text" th:field="*{department}">
        <span class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>

        <label>Salary</label>
        <input type="number" step="0.01" th:field="*{salary}">
        <span class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>

        <button type="submit" class="btn-save">Save Employee</button>
    </form>

    <h2>Search Employees</h2>
    <form th:action="@{/employees}" method="get" class="search-form">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Enter employee name">
        <button type="submit" class="btn-edit">Search</button>
        <a class="btn-cancel" th:href="@{/employees}">Clear</a>
    </form>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${employees.isEmpty()}">
            <td colspan="7">No employees found.</td>
        </tr>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}"></td>
            <td th:text="${emp.fullName}"></td>
            <td th:text="${emp.email}"></td>
            <td th:text="${emp.phone}"></td>
            <td th:text="${emp.department}"></td>
            <td th:text="${emp.salary}"></td>
            <td>
                <a class="btn-edit" th:href="@{/employees/{id}/edit(id=${emp.id})}">Edit</a>
                <form class="inline" th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post"
                      onsubmit="return confirm('Are you sure you want to delete this employee?');">
                    <button type="submit" class="btn-delete">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
